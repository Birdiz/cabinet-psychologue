<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ practice.name }}, {{ practice.profession }}{% endblock %}</title>
  <meta name="description" content="{{ practice.profession }} : présentation du cabinet et créneaux de consultation disponibles.">
  <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="brand" href="/">
        <span class="brand-name">{{ practice.name }}</span>
        <span class="brand-role">{{ practice.profession }}</span>
      </a>
      <a class="phone" href="tel:{{ practice.phone_e164 }}">{{ practice.phone_display }}</a>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap footer-row">
      <span>{{ practice.name }}, {{ practice.profession }}</span>
      <a href="/mentions-legales">Mentions légales</a>
    </div>
  </footer>
</body>
</html>
