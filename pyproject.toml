[project]
name = "cabinet"
version = "0.1.0"
description = "Website for a psychologist exposing its planning anonymously."
readme = "README.md"
authors = [
    { name = "Thomas Bouzy", email = "art.birdiz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "recurring-ical-events>=3.8.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "recurring_ical_events"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source_pkgs = ["cabinet"]

[tool.coverage.report]
fail_under = 95
show_missing = true
